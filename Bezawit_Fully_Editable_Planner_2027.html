                                ${items.length === 0 ? `<tr><td colspan="${config.headers.length + 1}" class="p-8 text-center text-creamy-600 italic">No entries yet. Click 'Add Entry' above.</td></tr>` : 
                                items.map(item => `
                                    <tr class="hover:bg-creamy-100/30 transition">
                                        ${config.fields.map(f => `
                                            <td class="p-3">
                                                <input type="text" value="${item[f] !== undefined ? item[f] : ''}" oninput="updateField('${config.key}', ${item.id}, '${f}', this.value)" />
                                            </td>
                                        `).join('')}
                                        <td class="p-3 text-right">
                                            <button onclick="deleteItem('${config.key}', ${item.id})" class="text-rose-600 hover:text-rose-800 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderDashboard() {
            return `
                <div class="space-y-8 animate-fadeIn">
                    <div class="bg-creamy-100 border border-creamy-200 rounded-2xl p-8 shadow-xs flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                        <div>
                            <span class="text-xs font-semibold tracking-wider text-creamy-600 uppercase bg-white border border-creamy-200 px-3 py-1 rounded-full shadow-xs">✨ Fully Editable 2027 Edition</span>
                            <h2 class="font-serif text-3xl font-bold text-creamy-700 mt-3">Welcome back, Bezawit.</h2>
                            <p class="text-sm text-creamy-600 mt-1 max-w-xl">Every planner section, table, and field across your 27+ tabs is fully editable in real-time.</p>
                        </div>
                        <div class="flex gap-3">
                            <button onclick="navigate('dailyPlanner')" class="px-5 py-2.5 bg-creamy-700 text-white text-sm font-medium rounded-xl shadow-xs hover:bg-creamy-600 transition">
                                Daily Planner
                            </button>
                            <button onclick="navigate('annualPlanning')" class="px-5 py-2.5 bg-white border border-creamy-200 text-creamy-700 text-sm font-medium rounded-xl hover:bg-creamy-100 transition shadow-xs">
                                Annual Goals
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                        <div class="bg-creamy-100 border border-creamy-200 rounded-2xl p-5 shadow-xs">
                            <span class="text-xs font-bold uppercase tracking-wider text-creamy-600">Active Planners</span>
                            <div class="text-3xl font-serif font-bold text-creamy-700 mt-2">27+ Tabs</div>
                            <p class="text-xs text-creamy-600 mt-2">Fully editable OS</p>
                        </div>
                        <div class="bg-creamy-100 border border-creamy-200 rounded-2xl p-5 shadow-xs">
                            <span class="text-xs font-bold uppercase tracking-wider text-creamy-600">Goal Progress</span>
                            <div class="text-3xl font-serif font-bold text-creamy-700 mt-2">65%</div>
                            <div class="w-full bg-creamy-200 rounded-full h-2 mt-3 overflow-hidden">
                                <div class="bg-creamy-700 h-full rounded-full" style="width: 65%"></div>
                            </div>
                        </div>
                        <div class="bg-creamy-100 border border-creamy-200 rounded-2xl p-5 shadow-xs">
                            <span class="text-xs font-bold uppercase tracking-wider text-creamy-600">Habit Streaks</span>
                            <div class="text-3xl font-serif font-bold text-creamy-700 mt-2">12 Days</div>
                            <p class="text-xs text-creamy-600 mt-2">Consistent momentum</p>
                        </div>
                        <div class="bg-creamy-100 border border-creamy-200 rounded-2xl p-5 shadow-xs">
                            <span class="text-xs font-bold uppercase tracking-wider text-creamy-600">Books Tracked</span>
                            <div class="text-3xl font-serif font-bold text-creamy-700 mt-2">24 Target</div>
                            <p class="text-xs text-creamy-600 mt-2">Knowledge repository</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function addItem(key, fields) {
            if (!db[key]) db[key] = [];
            const newItem = { id: Date.now() };
            fields.forEach(f => {
                newItem[f] = 'New ' + f;
            });
            db[key].push(newItem);
            saveDB();
            render();
        }

        function deleteItem(key, id) {
            db[key] = db[key].filter(i => i.id !== id);
            saveDB();
            render();
        }

        window.addEventListener('DOMContentLoaded', () => {
            render();
        });
    </script>
</body>
</html>
